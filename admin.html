<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⚙️ Админ-панель</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e1a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 30px 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .sub {
            color: #8899bb;
            font-size: 14px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #0a0e1a;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(247, 151, 30, 0.3);
        }
        .btn-danger {
            background: #e74c3c;
            color: #fff;
        }
        .btn-danger:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }
        .btn-success {
            background: #2ecc71;
            color: #fff;
        }
        .btn-success:hover {
            background: #27ae60;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: rgba(42, 58, 90, 0.6);
            color: #e0e0e0;
        }
        .btn-secondary:hover {
            background: rgba(42, 58, 90, 0.9);
            transform: translateY(-2px);
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 8px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 14px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: rgba(26, 36, 64, 0.6);
            padding: 16px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .stat-card .number {
            font-size: 28px;
            font-weight: 700;
            color: #f7971e;
        }
        .stat-card .label {
            font-size: 12px;
            color: #8899bb;
            margin-top: 4px;
        }
        .table-wrapper {
            overflow-x: auto;
            background: rgba(20, 27, 45, 0.8);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 4px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        table th {
            background: rgba(26, 36, 64, 0.4);
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            color: #8899bb;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            white-space: nowrap;
        }
        table td {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            vertical-align: middle;
        }
        table tr:hover td {
            background: rgba(26, 36, 64, 0.3);
        }
        .status-badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-active {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
        }
        .status-completed {
            background: rgba(247, 151, 30, 0.2);
            color: #f7971e;
        }
        .status-timeout {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
        }
        .status-abandoned {
            background: rgba(136, 153, 187, 0.2);
            color: #8899bb;
        }
        .result-badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .result-high {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
        }
        .result-mid {
            background: rgba(241, 196, 15, 0.2);
            color: #f1c40f;
        }
        .result-low {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
        }
        .branch-dots {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .branch-dot {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }
        .dot-hard {
            background: rgba(231, 76, 60, 0.25);
            color: #e74c3c;
        }
        .dot-medium {
            background: rgba(241, 196, 15, 0.25);
            color: #f1c40f;
        }
        .dot-easy {
            background: rgba(46, 204, 113, 0.25);
            color: #2ecc71;
        }
        .dot-timeout {
            background: rgba(142, 68, 173, 0.25);
            color: #9b59b6;
        }
        .action-btns {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #141b2d;
            border-radius: 20px;
            padding: 32px;
            max-width: 700px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .modal-header h2 {
            color: #fff;
            font-size: 20px;
        }
        .modal-close {
            background: none;
            border: none;
            color: #8899bb;
            font-size: 28px;
            cursor: pointer;
            transition: color 0.3s;
        }
        .modal-close:hover {
            color: #fff;
        }
        .modal-status {
            color: #8899bb;
            font-size: 14px;
            margin-bottom: 16px;
        }
        .answer-group {
            margin-bottom: 16px;
        }
        .answer-group h3 {
            color: #c0d0e0;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .answer-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(26, 36, 64, 0.3);
            margin-bottom: 4px;
        }
        .answer-item .q {
            color: #c0d0e0;
            font-size: 13px;
        }
        .answer-item .q .tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            margin-left: 8px;
        }
        .answer-item .score {
            font-weight: 600;
            font-size: 14px;
        }
        .answer-item .score.green {
            color: #2ecc71;
        }
        .answer-item .score.yellow {
            color: #f1c40f;
        }
        .answer-item .score.red {
            color: #e74c3c;
        }
        .answer-item .score.timeout {
            color: #9b59b6;
        }
        .branch-path {
            background: rgba(26, 36, 64, 0.4);
            padding: 12px 16px;
            border-radius: 10px;
            margin-top: 12px;
            font-size: 14px;
            color: #8899bb;
        }
        .branch-path strong {
            color: #c0d0e0;
        }
        .branch-path .arrow {
            color: #f7971e;
            margin: 0 4px;
        }
        .last-updated {
            color: #8899bb;
            font-size: 13px;
            text-align: right;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #8899bb;
        }
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .header-actions {
                justify-content: center;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            table {
                font-size: 12px;
            }
            table th,
            table td {
                padding: 8px 10px;
            }
            .modal-content {
                padding: 20px;
            }
            .action-btns .btn {
                font-size: 11px;
                padding: 4px 10px;
            }
        }
        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 22px;
            }
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0e1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a3a5a;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3a4a6a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>⚙️ Админ-панель</h1>
                <div class="sub">Просмотр ответов и управление игроками</div>
            </div>
            <div class="header-actions">
                <a href="index.html" class="btn btn-secondary">🏠 На главную</a>
                <button class="btn btn-secondary" onclick="renderAdmin()">🔄 Обновить</button>
                <button class="btn btn-success" onclick="exportData()">📤 Экспорт</button>
                <button class="btn btn-danger" onclick="clearAllData()">🗑️ Очистить всё</button>
            </div>
        </div>
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><div class="number" id="totalPlayers">0</div><div class="label">Всего игроков</div></div>
            <div class="stat-card"><div class="number" id="completedCount">0</div><div class="label">Завершили</div></div>
            <div class="stat-card"><div class="number" id="activeCount">0</div><div class="label">Активны</div></div>
            <div class="stat-card"><div class="number" id="avgScore">0%</div><div class="label">Средний результат</div></div>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Имя</th>
                        <th>Статус</th>
                        <th>Дата</th>
                        <th>Результат</th>
                        <th>🟢</th>
                        <th>🟡</th>
                        <th>🔴</th>
                        <th>Ветки</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="adminBody">
                    <tr><td colspan="10" style="text-align:center;color:#8899bb;padding:40px;">
                            <div class="empty-state"><div class="icon">📭</div><div>Нет данных об игроках</div></div>
                        </td></tr>
                </tbody>
            </table>
        </div>
        <div class="last-updated" id="lastUpdated">Последнее обновление: —</div>
    </div>

    <div class="modal" id="answersModal">
        <div class="modal-content">
            <div class="modal-header"><h2 id="modalTitle">Ответы игрока</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
            <div class="modal-status" id="modalStatus"></div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'quiz_players';

        function getPlayers() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
        }

        function savePlayers(p) { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }

        function getPlayer(n) { const p = getPlayers(); return p[n] || null; }

        function deletePlayer(n) {
            if (!confirm(`Удалить игрока "${n}"?`)) return;
            const p = getPlayers();
            delete p[n];
            savePlayers(p);
            renderAdmin();
        }

        function clearAllData() {
            if (!confirm('🗑️ Удалить ВСЕ данные?')) return;
            localStorage.removeItem(STORAGE_KEY);
            renderAdmin();
        }

        function exportData() {
            const d = getPlayers();
            if (Object.keys(d).length === 0) { alert('Нет данных'); return; }
            const b = new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' });
            const u = URL.createObjectURL(b);
            const a = document.createElement('a');
            a.href = u;
            a.download = `quiz_data_${new Date().toISOString().slice(0, 10)}.json`;
            a.click();
            URL.revokeObjectURL(u);
        }

        function getStatusInfo(p) {
            if (p.completed) return { label: '🏁 Завершена', class: 'status-completed' };
            if (p.timeout) return { label: '⏰ Таймаут', class: 'status-timeout' };
            if (p.isActive) return { label: '🟢 Активна', class: 'status-active' };
            return { label: '⏸️ Прервана', class: 'status-abandoned' };
        }

        function getResultBadge(percent) {
            if (percent >= 65) return { label: `${percent}%`, class: 'result-high' };
            if (percent >= 40) return { label: `${percent}%`, class: 'result-mid' };
            return { label: `${percent}%`, class: 'result-low' };
        }

        function getBranchDots(history) {
            if (!history || history.length === 0) return '<span style="color:#8899bb;font-size:12px;">—</span>';
            const counts = {};
            history.forEach(b => { counts[b] = (counts[b] || 0) + 1; });
            const labels = { hard: '🔥', medium: '⚡', easy: '🌱', timeout: '⏰' };
            const classes = { hard: 'dot-hard', medium: 'dot-medium', easy: 'dot-easy', timeout: 'dot-timeout' };
            return Object.entries(counts).map(([b, c]) =>
                `<span class="branch-dot ${classes[b] || ''}">${labels[b] || '❓'}${c}</span>`).join(' ');
        }

        function renderAdmin() {
            const players = getPlayers();
            const names = Object.keys(players);
            const total = names.length;
            const completed = names.filter(n => players[n].completed).length;
            const active = names.filter(n => players[n].isActive && !players[n].completed && !players[n].timeout).length;
            let allGreen = 0,
                allTotal = 0;
            names.forEach(n => {
                const p = players[n];
                if (p.completed || p.timeout) { allGreen += (p.greenCount || 0);
                    allTotal += (p.totalQuestions || 15); }
            });
            const avg = allTotal > 0 ? Math.round((allGreen / allTotal) * 100) : 0;
            document.getElementById('totalPlayers').textContent = total;
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('activeCount').textContent = active;
            document.getElementById('avgScore').textContent = avg + '%';
            document.getElementById('lastUpdated').textContent = `Последнее обновление: ${new Date().toLocaleString()}`;
            const tbody = document.getElementById('adminBody');
            if (names.length === 0) {
                tbody.innerHTML =
                    `<tr><td colspan="10" style="text-align:center;color:#8899bb;padding:40px;"><div class="empty-state"><div class="icon">📭</div><div>Нет данных об игроках</div></div></td></tr>`;
                return;
            }
            const sorted = names.sort((a, b) => {
                const pa = players[a],
                    pb = players[b];
                const getWeight = (p) => { if (p.completed) return 0; if (p.isActive) return 1; return 2; };
                return getWeight(pa) - getWeight(pb) || a.localeCompare(b);
            });
            tbody.innerHTML = sorted.map((name, i) => {
                const p = players[name];
                const status = getStatusInfo(p);
                const totalQ = p.totalQuestions || 15;
                const green = p.greenCount || 0;
                const yellow = p.yellowCount || 0;
                const red = (p.redCount || 0) + (p.timeoutCount || 0);
                const percent = Math.round((green / totalQ) * 100);
                const resultBadge = getResultBadge(percent);
                const date = p.endedAt ? new Date(p.endedAt).toLocaleString() : (p.startedAt ? new Date(p.startedAt)
                    .toLocaleString() : '—');
                const branchDots = getBranchDots(p.branchHistory);
                const isCompleted = p.completed || p.timeout;
                return `<tr>
                    <td>${i + 1}</td>
                    <td><strong>${name}</strong></td>
                    <td><span class="status-badge ${status.class}">${status.label}</span></td>
                    <td style="font-size:12px;color:#8899bb;">${date}</td>
                    <td><span class="result-badge ${resultBadge.class}">${resultBadge.label}</span></td>
                    <td style="color:#2ecc71;font-weight:600;">${green}</td>
                    <td style="color:#f1c40f;font-weight:600;">${yellow}</td>
                    <td style="color:#e74c3c;font-weight:600;">${red}</td>
                    <td><div class="branch-dots">${branchDots}</div></td>
                    <td><div class="action-btns">
                        <button class="btn btn-secondary btn-sm" onclick="viewAnswers('${name}')">📋</button>
                        ${isCompleted ? `<button class="btn btn-danger btn-sm" onclick="deletePlayer('${name}')">🗑️</button>` : ''}
                    </div></td>
                </tr>`;
            }).join('');
        }

        function viewAnswers(name) {
            const p = getPlayer(name);
            if (!p) { alert('Игрок не найден'); return; }
            document.getElementById('modalTitle').textContent = `📋 Ответы: ${name}`;
            const status = getStatusInfo(p);
            document.getElementById('modalStatus').innerHTML =
                `Статус: <span class="status-badge ${status.class}">${status.label}</span>`;
            const body = document.getElementById('modalBody');
            let html = '';
            if (p.testScores && p.testScores.length > 0) {
                html += `<div class="answer-group"><h3>🧪 Тестовые вопросы (5)</h3>`;
                p.testScores.forEach((s, i) => {
                    const color = s === 4 ? 'green' : s === 3 ? 'yellow' : 'red';
                    html += `<div class="answer-item"><span class="q">Вопрос ${i + 1}</span><span class="score ${color}">${s} балла</span></div>`;
                });
                html += `</div>`;
            }
            if (p.mainAnswers && p.mainAnswers.length > 0) {
                html += `<div class="answer-group"><h3>📝 Основные вопросы (10)</h3>`;
                p.mainAnswers.forEach((a, i) => {
                    const color = a.score === 4 ? 'green' : a.score === 3 ? 'yellow' : 'red';
                    const timeout = a.timeout ? ' ⏰' : '';
                    const branchLabel = a.branchLabel || a.branch || '—';
                    html += `<div class="answer-item">
                        <span class="q">Вопрос ${i + 1} <span class="tag">${branchLabel}</span></span>
                        <span class="score ${color}">${a.score} балла${timeout}</span>
                    </div>`;
                });
                html += `</div>`;
            }
            if (p.branchHistory && p.branchHistory.length > 0) {
                const labels = { hard: '🔥 Сложная', medium: '⚡ Средняя', easy: '🌱 Лёгкая', timeout: '⏰ Таймаут' };
                const path = p.branchHistory.map(b => labels[b] || '❓').join(' <span class="arrow">→</span> ');
                html += `<div class="branch-path"><strong>🗺️ Путь по веткам:</strong><br>${path}</div>`;
            }
            const total = p.totalQuestions || 15;
            const green = p.greenCount || 0;
            const yellow = p.yellowCount || 0;
            const red = (p.redCount || 0) + (p.timeoutCount || 0);
            const percent = Math.round((green / total) * 100);
            html += `<div class="branch-path" style="margin-top:12px;">
                <strong>📊 Статистика:</strong><br>
                🟢 100%: ${green} &nbsp;|&nbsp; 🟡 65%: ${yellow} &nbsp;|&nbsp; 🔴 25%: ${red}<br>
                Результат: <strong>${percent}%</strong>
                ${p.timeoutCount ? `&nbsp;|&nbsp; ⏰ Таймаутов: ${p.timeoutCount}` : ''}
            </div>`;
            body.innerHTML = html;
            document.getElementById('answersModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('answersModal').classList.remove('active');
        }
        document.getElementById('answersModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });
        setInterval(renderAdmin, 30000);
        renderAdmin();
    </script>
</body>
</html>
