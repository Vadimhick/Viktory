    async function savePlayerToCloud(name, data) {
        if (!dbReady || !db) return false;
        try {
            const { error } = await db.from('players').upsert({
                name: name,
                is_active: data.isActive || false,
                completed: data.completed || false,
                timeout: data.timeout || false,
                started_at: data.startedAt || null,
                ended_at: data.endedAt || null,
                current_phase: data.currentPhase || 'test',
                current_question: data.currentQuestion || 0,
                current_branch: data.currentBranch || null,
                test_scores: JSON.stringify(data.testScores || []),
                main_answers: JSON.stringify(data.mainAnswers || []),
                branch_history: JSON.stringify(data.branchHistory || []),
                total_questions: data.totalQuestions || 15,
                green_count: data.greenCount || 0,
                yellow_count: data.yellowCount || 0,
                red_count: data.redCount || 0,
                timeout_count: data.timeoutCount || 0,
                secret_answered: data.secretAnswered || false,
                secret_answer: data.secretAnswer || '',
                updated_at: new Date().toISOString()
            }, { onConflict: 'name' });
            if (error) { console.error('❌ Ошибка:', error); return false; }
            return true;
        } catch (e) { console.error('❌ Ошибка:', e); return false; }
    }

    async function getPlayerFromCloud(name) {
        if (!dbReady || !db) return null;
        try {
            const { data, error } = await db.from('players').select('*').eq('name', name).maybeSingle();
            if (error || !data) return null;
            return {
                name: data.name, isActive: data.is_active, completed: data.completed,
                timeout: data.timeout, startedAt: data.started_at, endedAt: data.ended_at,
                currentPhase: data.current_phase, currentQuestion: data.current_question,
                currentBranch: data.current_branch,
                testScores: JSON.parse(data.test_scores || '[]'),
                mainAnswers: JSON.parse(data.main_answers || '[]'),
                branchHistory: JSON.parse(data.branch_history || '[]'),
                totalQuestions: data.total_questions || 15,
                greenCount: data.green_count || 0,
                yellowCount: data.yellow_count || 0,
                redCount: data.red_count || 0,
                timeoutCount: data.timeout_count || 0,
                secretAnswered: data.secret_answered || false,
                secretAnswer: data.secret_answer || ''
            };
        } catch (e) { console.error('❌ Ошибка:', e); return null; }
    }

    async function getAllPlayers() {
        if (!dbReady || !db) return {};
        try {
            const { data, error } = await db.from('players').select('*').order('ended_at', { ascending: false });
            if (error) return {};
            const result = {};
            data.forEach(row => {
                result[row.name] = {
                    name: row.name, isActive: row.is_active, completed: row.completed,
                    timeout: row.timeout, startedAt: row.started_at, endedAt: row.ended_at,
                    currentPhase: row.current_phase, currentQuestion: row.current_question,
                    currentBranch: row.current_branch,
                    testScores: JSON.parse(row.test_scores || '[]'),
                    mainAnswers: JSON.parse(row.main_answers || '[]'),
                    branchHistory: JSON.parse(row.branch_history || '[]'),
                    totalQuestions: row.total_questions || 15,
                    greenCount: row.green_count || 0, yellowCount: row.yellow_count || 0,
                    redCount: row.red_count || 0, timeoutCount: row.timeout_count || 0,
                    secretAnswered: row.secret_answered || false,
                    secretAnswer: row.secret_answer || ''
                };
            });
            return result;
        } catch (e) { console.error('❌ Ошибка:', e); return {}; }
    }

        }
        if (name.length < 2) {
            errorEl.textContent = '⚠️ Минимум 2 символа';
            nameInput.style.borderColor = '#ff5c6c';
            return;
        }
        if (!/^[a-zA-Zа-яА-ЯёЁ\s\-]+$/.test(name)) {
            errorEl.textContent = '⚠️ Используйте только буквы!';
            nameInput.style.borderColor = '#ff5c6c';
            return;
        }

        errorEl.textContent = '';
        nameInput.style.borderColor = '';

        try {
            const existing = await getPlayerFromCloud(name);
            if (existing && (existing.completed || existing.timeout)) {
                errorEl.textContent = '⛔ Вы уже проходили эту викторину!';
                nameInput.style.borderColor = '#ff5c6c';
                return;
            }

            playerName = name;
            gameData = {
                name: name,
                isActive: true,
                completed: false,
                timeout: false,
                startedAt: new Date().toISOString(),
                endedAt: null,
                currentPhase: 'test',
                currentQuestion: 0,
                currentBranch: null,
                testScores: [],
                mainAnswers: [],
                branchHistory: [],
                totalQuestions: 15,
                greenCount: 0,
                yellowCount: 0,
                redCount: 0,
                timeoutCount: 0,
                secretAnswered: false,
                secretAnswer: ''
            };

            await savePlayerToCloud(name, gameData);
            showToast('🎮 Игра началась! Удачи!', 'success');
            showScreen('quiz-screen');
            
            // Показываем первый вопрос
            setTimeout(showQuestion, 500);
        } catch (e) {
            console.error('❌ Ошибка:', e);
            errorEl.textContent = '⚠️ Ошибка подключения к серверу';
            showToast('❌ Ошибка подключения', 'error');
        }
    }

    // ============================================================
    // 📖 ПОКАЗ ВОПРОСА
    // ============================================================
    function getCurrentQuestion(game) {
        if (!game) return null;
        
        if (game.currentPhase === 'test') {
            const idx = game.currentQuestion;
            if (idx >= testQuestions.length) return null;
            return { ...testQuestions[idx], isTest: true };
        } else {
            const branchId = game.currentBranch || 'easy';
            const branch = branches[branchId];
            if (!branch) return null;
            const idx = game.currentQuestion - testQuestions.length;
            if (idx >= branch.questions.length) return null;
            return { ...branch.questions[idx], isTest: false, branchLabel: branch.label, branchId: branchId };
        }
    }

    async function showQuestion() {
        console.log('📖 showQuestion вызвана');
        
        // Загружаем данные игрока
        const game = await getPlayerFromCloud(playerName);
        if (!game || !game.isActive) {
            showScreen('start-screen');
            return;
        }
        gameData = game;

        const question = getCurrentQuestion(game);
        if (!question) {
            finishQuiz();
            return;
        }

        const total = game.totalQuestions || 15;
        const current = game.currentQuestion + 1;
        document.getElementById('question-number').textContent = `Вопрос ${current} / ${total}`;
        document.getElementById('progress-bar').style.width = `${(game.currentQuestion / total) * 100}%`;

        document.getElementById('question').textContent = question.text;

        const container = document.getElementById('answers');
        container.className = 'answers';
        container.innerHTML = '';
        const letters = ['A', 'B', 'C', 'D'];

        question.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'answer';
            btn.innerHTML = `<span class="letter">${letters[idx]}.</span> ${opt.text}`;
            btn.onclick = () => selectAnswer(idx);
            container.appendChild(btn);
        });

        document.getElementById('timeoutOverlay').style.display = 'none';
        timer = TIME_LIMIT;
        updateTimer();
        startTimer();
    }

    function startTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timer--;
            updateTimer();
            if (timer <= 0) {
                clearInterval(timerInterval);
                handleTimeout();
            }
        }, 1000);
    }

    function updateTimer() {
        const el = document.getElementById('timer');
        el.textContent = timer;
        el.classList.toggle('danger', timer <= 5);
    }

    // ============================================================
    // 🎯 ОБРАБОТКА ОТВЕТОВ
    // ============================================================
    async function selectAnswer(index) {
        if (isAnswering) return;
        isAnswering = true;
        clearInterval(timerInterval);

        const game = await getPlayerFromCloud(playerName);
        if (!game || !game.isActive) return;
        const question = getCurrentQuestion(game);
        if (!question) return;

        const score = question.options[index].score;
        const btns = document.querySelectorAll('.answer');
        btns.forEach((btn, i) => {
            btn.disabled = true;
            if (i === index) btn.classList.add('selected');
        });

        setTimeout(() => { processAnswer(score);
            isAnswering = false; }, 400);
    }

    async function handleTimeout() {
        if (isAnswering) return;
        isAnswering = true;
        const game = await getPlayerFromCloud(playerName);
        if (!game || !game.isActive) return;

        document.getElementById('timeoutOverlay').style.display = 'block';
        game.isActive = false;
        game.timeout = true;
        game.endedAt = new Date().toISOString();

        const question = getCurrentQuestion(game);
        if (question) {
            const score = 1;
            const branchId = game.currentBranch || 'easy';
            game.mainAnswers.push({
                questionId: question.id,
                branch: branchId,
                score: score,
                branchLabel: question.branchLabel || branches[branchId]?.label || '🌱 Лёгкая',
                timeout: true
            });
            game.branchHistory.push('timeout');
            game.timeoutCount++;
        }
        await savePlayerToCloud(playerName, game);
        showToast('⏰ Время вышло!', 'error');
    }

    async function processAnswer(score) {
        const game = await getPlayerFromCloud(playerName);
        if (!game || !game.isActive) return;
        const question = getCurrentQuestion(game);
        if (!question) return;

        const branchId = game.currentBranch || 'easy';

        if (question.isTest) {
            game.testScores.push(score);
            if (game.currentQuestion >= testQuestions.length - 1) {
                const startBranch = getStartBranch(game.testScores);
                game.currentBranch = startBranch;
                game.currentPhase = 'main';
                game.currentQuestion = testQuestions.length;
                game.branchHistory.push(startBranch);
                await savePlayerToCloud(playerName, game);
                showQuestion();
                return;
            }
        } else {
            const branchLabel = question.branchLabel || branches[branchId]?.label || '🌱 Лёгкая';
            game.mainAnswers.push({
                questionId: question.id,
                branch: branchId,
                score: score,
                branchLabel: branchLabel,
                timeout: false
            });
            if (score === 4) game.greenCount++;
            else if (score === 3) game.yellowCount++;
            else game.redCount++;

            const nextBranch = getNextBranch(branchId, score);
            game.currentBranch = nextBranch;
            game.branchHistory.push(nextBranch);
        }

        game.currentQuestion++;
        if (game.currentQuestion >= game.totalQuestions) {
            finishQuiz();
            return;
        }

        await savePlayerToCloud(playerName, game);
        showQuestion();
    }

    // ============================================================
    // 🏆 ФИНАЛ
    // ============================================================
    async function finishQuiz() {
        console.log('🏆 finishQuiz вызвана');
        
        const game = await getPlayerFromCloud(playerName);
        if (!game) return;
        game.isActive = false;
        game.completed = true;
        game.endedAt = new Date().toISOString();
        await savePlayerToCloud(playerName, game);

        const total = game.totalQuestions;
        const green = game.greenCount;
        const yellow = game.yellowCount;
        const red = game.redCount + game.timeoutCount;
        const greenPercent = Math.round((green / total) * 100);

        let rankEmoji, rankTitle, verdictText, verdictClass;
        if (greenPercent >= 96) {
            rankEmoji = '👑';
            rankTitle = 'Лучший знаток';
            verdictText = '🟢 ТЫ ЗНАЕШЬ МЕНЯ ИДЕАЛЬНО!';
            verdictClass = 'good';
        } else if (greenPercent >= 81) {
            rankEmoji = '🔥';
            rankTitle = 'Ты слишком много обо мне знаешь';
            verdictText = '🟢 ТЫ ОЧЕНЬ ХОРОШО МЕНЯ ЗНАЕШЬ!';
            verdictClass = 'good';
        } else if (greenPercent >= 61) {
            rankEmoji = '❤️';
            rankTitle = 'Хорошо меня чувствуешь';
            verdictText = '🟢 ТЫ ХОРОШО МЕНЯ ЗНАЕШЬ!';
            verdictClass = 'good';
        } else if (greenPercent >= 41) {
            rankEmoji = '🙂';
            rankTitle = 'Неплохо знаешь';
            verdictText = '🟡 ТЫ ЗНАЕШЬ МЕНЯ НА ПОЛОВИНУ';
            verdictClass = 'mid';
        } else if (greenPercent >= 21) {
            rankEmoji = '🌱';
            rankTitle = 'Нужно ещё пообщаться';
            verdictText = '🔴 ТЫ ПЛОХО МЕНЯ ЗНАЕШЬ';
            verdictClass = 'bad';
        } else {
            rankEmoji = '👤';
            rankTitle = 'Мы вообще знакомы?';
            verdictText = '🔴 ТЫ СОВСЕМ МЕНЯ НЕ ЗНАЕШЬ';
            verdictClass = 'bad';
        }

        document.getElementById('result-level').textContent = `${rankEmoji} ${rankTitle}`;
        document.getElementById('result-percentage').textContent = `${greenPercent}%`;
        document.getElementById('correct-count').textContent = green;
        document.getElementById('yellow-count').textContent = yellow;
        document.getElementById('wrong-count').textContent = red;

        document.getElementById('result-message').textContent =
            `Ты ответил правильно на ${green} из ${total} вопросов (${greenPercent}%)`;

        const allPlayers = await getAllPlayers();
        const completed = Object.values(allPlayers).filter(p => p.completed && p.name !== playerName);
        const better = completed.filter(p => (p.greenCount || 0) / (p.totalQuestions || 15) * 100 < greenPercent).length;
        const totalPlayers = completed.length + 1;
        const betterPercent = totalPlayers > 0 ? Math.round((better / totalPlayers) * 100) : 0;
        document.getElementById('result-compare').innerHTML =
            `Ты знаешь меня лучше, чем <strong>${betterPercent}%</strong> участников`;

        document.getElementById('finalVerdict').textContent = verdictText;
        document.getElementById('finalVerdict').className = `final-verdict ${verdictClass}`;
        document.getElementById('finalDetails').innerHTML =
            `Всего вопросов: ${total}<br>⏱️ Таймаутов: ${game.timeoutCount || 0}`;

        if (greenPercent > 60) {
            secretUnlocked = true;
            const secretArea = document.getElementById('secretArea');
            secretArea.classList.add('show');
            document.getElementById('secretQuestion').textContent = secretQuestion.text;
        }

        showScreen('result-screen');
        launchConfetti();
        showToast(`🎉 Результат: ${greenPercent}%!`, 'success');
    }

    function launchConfetti() {
        for (let i = 0; i < 100; i++) {
            const piece = document.createElement('div');
            piece.className = 'confetti';
            piece.style.left = Math.random() * 100 + 'vw';
            piece.style.animationDelay = Math.random() * 1.5 + 's';
            piece.style.background = `hsl(${Math.random() * 360}, 80%, 60%)`;
            document.body.appendChild(piece);
            setTimeout(() => piece.remove(), 4500);
        }
    }

    // ============================================================
    // 🎯 ФУНКЦИИ ДЛЯ HTML (onclick)
    // ============================================================
    function handleSecretTextAnswer() {
        if (secretAnswered) return;

        const input = document.getElementById('secretInput');
        const answer = input.value.trim();

        if (!answer) {
            showToast('⚠️ Напиши свой ответ на вопрос...', 'error');
            return;
        }

        secretAnswered = true;
        input.disabled = true;
        document.getElementById('secretSubmitBtn').disabled = true;

        const resultEl = document.getElementById('secretResult');
        resultEl.className = 'secret-result show correct';
        resultEl.innerHTML = `
            ✅ Спасибо за честный ответ.<br>
            <span class="answer-text">Твой ответ: "${answer}"</span>
            <span class="message">Иногда прошлое живёт в нас дольше, чем мы готовы признать.</span>
        `;

        getPlayerFromCloud(playerName).then(game => {
            if (game) {
                game.secretAnswered = true;
                game.secretAnswer = answer;
                savePlayerToCloud(playerName, game);
            }
        });

        showToast('💬 Спасибо за искренний ответ!', 'success');
        setTimeout(launchConfetti, 500);
    }

    function shareResult() {
        const percent = document.getElementById('result-percentage').textContent;
        const level = document.getElementById('result-level').textContent;
        const text = `🎮 Я прошёл викторину «На сколько хорошо ты меня знаешь?»\nМой результат: ${percent}\n${level}\n\nПопробуй и ты!`;
        if (navigator.share) {
            navigator.share({ title: 'Мой результат', text: text });
        } else {
            navigator.clipboard.writeText(text).then(() => {
                showToast('📋 Результат скопирован!', 'success');
            });
        }
    }

    // ============================================================
    // 🖥️ АДМИН-ПАНЕЛЬ
    // ============================================================
    async function renderAdmin() {
        const tbody = document.getElementById('adminBody');
        if (!dbReady || !db) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#ff5c6c;padding:30px;">⏳ Подключение к базе данных...</td></tr>';
            return;
        }

        try {
            const players = await getAllPlayers();
            const names = Object.keys(players);
            if (names.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#8899bb;padding:30px;">📭 Нет данных</td></tr>';
                document.getElementById('adminStatus').textContent = '📭 Нет записей';
                return;
            }

            tbody.innerHTML = names.map(name => {
                const p = players[name];
                let status = '🟢 Активна', color = '#2ecc71';
                if (p.completed) { status = '🏁 Завершена'; color = '#f7971e'; }
                if (p.timeout) { status = '⏰ Таймаут'; color = '#ff5c6c'; }
                if (!p.isActive && !p.completed && !p.timeout) { status = '⏸️ Прервана'; color = '#8899bb'; }

                const total = p.totalQuestions || 15;
                const green = p.greenCount || 0;
                const percent = Math.round((green / total) * 100);
                const date = p.endedAt ? new Date(p.endedAt).toLocaleString() :
                    (p.startedAt ? new Date(p.startedAt).toLocaleString() : '-');
                const badgeColor = percent >= 65 ? '#39d98a' : percent >= 40 ? '#f1c40f' : '#ff5c6c';
                const isCompleted = p.completed || p.timeout;

                return `<tr>
                    <td><strong>${name}</strong></td>
                    <td style="color:${color}">${status}</td>
                    <td style="font-size:12px;color:#8899bb;">${date}</td>
                    <td><span style="background:${badgeColor};padding:3px 12px;border-radius:12px;font-size:12px;font-weight:600;color:#0f1117;">${percent}%</span></td>
                    <td>
                        <button class="admin-btn admin-btn-view" onclick="viewAnswers('${name}')">📋</button>
                        ${isCompleted ? `<button class="admin-btn admin-btn-del" onclick="deletePlayer('${name}')">🗑️</button>` : ''}
                    </td>
                </tr>`;
            }).join('');
            document.getElementById('adminStatus').textContent = `✅ Загружено ${names.length} записей`;
        } catch (e) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#ff5c6c;padding:30px;">❌ Ошибка загрузки</td></tr>';
        }
    }

    async function viewAnswers(name) {
        const p = await getPlayerFromCloud(name);
        if (!p) { showToast('⚠️ Игрок не найден', 'error'); return; }
        document.getElementById('modalTitle').textContent = `📋 Ответы: ${name}`;
        document.getElementById('modalBody').innerHTML = `
            <p style="color:#8899bb;">Статус: ${p.completed ? '🏁 Завершена' : p.timeout ? '⏰ Таймаут' : '⏸️ Прервана'}</p>
            <div style="margin-top:12px;padding:10px;background:rgba(26,36,64,0.3);border-radius:8px;font-size:13px;color:#8899bb;">
                <strong>📊 Статистика:</strong><br>
                🟢 100%: ${p.greenCount || 0} &nbsp;|&nbsp; 🟡 65%: ${p.yellowCount || 0} &nbsp;|&nbsp; 🔴 25%: ${(p.redCount || 0) + (p.timeoutCount || 0)}
            </div>
        `;
        document.getElementById('answersModal').classList.add('active');
    }

    function closeModal() { document.getElementById('answersModal').classList.remove('active'); }

    async function deletePlayer(name) {
        if (!confirm(`🗑️ Удалить игрока "${name}"?`)) return;
        if (!dbReady || !db) { showToast('❌ Нет подключения', 'error'); return; }
        try {
            await db.from('players').delete().eq('name', name);
            showToast(`✅ Игрок "${name}" удалён`, 'success');
            renderAdmin();
        } catch (e) { showToast('❌ Ошибка удаления', 'error'); }
    }

    async function clearAllData() {
        if (!confirm('⚠️ Удалить ВСЕ данные?')) return;
        if (!dbReady || !db) { showToast('❌ Нет подключения', 'error'); return; }
        try {
            await db.from('players').delete().neq('name', '');
            showToast('🗑️ Все данные удалены', 'info');
            renderAdmin();
        } catch (e) { showToast('❌ Ошибка очистки', 'error'); }
    }

    async function exportData() {
        const players = await getAllPlayers();
        const names = Object.keys(players);
        if (names.length === 0) { showToast('📭 Нет данных', 'info'); return; }
        const blob = new Blob([JSON.stringify({ exported_at: new Date().toISOString(), total_players: names.length, players }, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `quiz_data_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(a.href);
        showToast(`📤 Экспортировано ${names.length} записей`, 'success');
    }

    // ============================================================
    // 🔗 ОБРАБОТЧИКИ КНОПОК
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        console.log('📄 DOM загружен');

        document.getElementById('startBtn').addEventListener('click', openDisclaimer);
        document.getElementById('adminBtn').addEventListener('click', openAdminPassword);
        document.getElementById('disclaimerCancelBtn').addEventListener('click', closeDisclaimer);
        document.getElementById('acceptBtn').addEventListener('click', acceptDisclaimer);
        document.getElementById('adminCancelBtn').addEventListener('click', closeAdminPassword);
        document.getElementById('adminLoginBtn').addEventListener('click', checkAdminPassword);
        document.getElementById('refreshAdminBtn').addEventListener('click', renderAdmin);
        document.getElementById('clearAllBtn').addEventListener('click', clearAllData);
        document.getElementById('exportBtn').addEventListener('click', exportData);

        document.getElementById('adminPasswordInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); checkAdminPassword(); }
        });
        document.getElementById('player-name').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); openDisclaimer(); }
        });

        console.log('✅ Все обработчики навешаны');
    });

    // ============================================================
    // 🏁 ПОКАЗЫВАЕМ СТАРТОВЫЙ ЭКРАН
    // ============================================================
    showScreen('start-screen');
    console.log('✅ Приложение загружено');
</script>
